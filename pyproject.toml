[project]
name = "hl-mft"
version = "0.1.0"
description = "Hyperliquid mid-frequency trading bot: flow-following micro-momentum"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13,<16",
    "aiohttp>=3.10,<4",
    "orjson>=3.10",
    "pyarrow>=17",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "prometheus-client>=0.20",
    "hyperliquid-python-sdk>=0.24,<1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
hl-mft = "hl_mft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hl_mft"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
